[project]
name = "portinari"
version = "0.1.0"
description = "Pipeline agêntico de ilustração da Syntaxis (light + dark), orquestrado pelo Claude Code"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pillow>=11",
]

[project.scripts]
portinari = "portinari.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portinari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
